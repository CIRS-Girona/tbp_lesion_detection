# ============================================================
# sweep_config_v12_noaug.yaml
# WandB Sweep -- YOLOv12s | No Augmentation | F1 Objective
# Project: iToBoS Skin Lesion Detection
# Location: yamin/experiment-v12/
#
# Mirrors the v26 noaug ablation -- same search space, same metric.
# Runs from ~/code/iToBoS/ so program path starts with yamin/
# ============================================================

program: yamin/experiment-v12/hparam_sweep.py
method: bayes

# Fixed args passed to the script on every trial (NOT hyperparameters)
command:
  - ${env}
  - python
  - ${program}
  - --model
  - yolo12s.pt
  - --aug_mode
  - noaug

metric:
  name: final/F1
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:

  # ── Learning Rate ──────────────────────────────────────────
  lr0:
    distribution: log_uniform_values
    min: 0.00001        # 1e-5
    max: 0.01           # 1e-2

  lrf:
    distribution: uniform
    min: 0.001
    max: 0.15

  # ── Regularisation ─────────────────────────────────────────
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01

  dropout:
    distribution: uniform
    min: 0.0
    max: 0.4

  # ── Optimiser ──────────────────────────────────────────────
  momentum:
    distribution: uniform
    min: 0.85
    max: 0.98

  # ── Warmup ─────────────────────────────────────────────────
  warmup_epochs:
    values: [2, 3, 5]

  warmup_momentum:
    distribution: uniform
    min: 0.5
    max: 0.9

  # ── Loss Weights ───────────────────────────────────────────
  box:
    distribution: uniform
    min: 4.0
    max: 10.0

  cls:
    distribution: uniform
    min: 0.3
    max: 2.0

  dfl:
    distribution: uniform
    min: 1.0
    max: 2.5

  iou:
    distribution: uniform
    min: 0.5
    max: 0.8

  # ── Augmentation: ONLY fliplr (noaug mode) ─────────────────
  # All other aug disabled in code: mosaic=0, mixup=0, hsv_s=0, etc.
  fliplr:
    distribution: uniform
    min: 0.0
    max: 0.7
