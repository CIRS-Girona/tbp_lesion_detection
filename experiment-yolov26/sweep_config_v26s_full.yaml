# ============================================================
# sweep_config_v26s_full.yaml
# WandB Sweep -- YOLOv26s | Full Augmentation | F1 Objective
# Project: iToBoS Skin Lesion Detection
# Location: yamin/experiment-v26/
#
# Follows the same structure as experiment-v11 and experiment-v12.
# Augmentation params are tunable hyperparameters in this sweep.
# Runs from ~/code/iToBoS/ so program path starts with yamin/
# ============================================================

program: yamin/experiment-v26/hparam_sweep.py
method: bayes

# Fixed args passed to the script on every trial (NOT hyperparameters)
command:
  - ${env}
  - python
  - ${program}
  - --model
  - yolo26s.pt
  - --aug_mode
  - full
  - --device
  - "1"

metric:
  name: final/F1
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:

  # ── Learning Rate ──────────────────────────────────────────
  lr0:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01

  lrf:
    distribution: uniform
    min: 0.001
    max: 0.15

  # ── Regularisation ─────────────────────────────────────────
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01

  dropout:
    distribution: uniform
    min: 0.0
    max: 0.4

  # ── Optimiser ──────────────────────────────────────────────
  momentum:
    distribution: uniform
    min: 0.85
    max: 0.98

  # ── Warmup ─────────────────────────────────────────────────
  warmup_epochs:
    values: [2, 3, 5]

  warmup_momentum:
    distribution: uniform
    min: 0.5
    max: 0.9

  # ── Loss Weights ───────────────────────────────────────────
  box:
    distribution: uniform
    min: 4.0
    max: 10.0

  cls:
    distribution: uniform
    min: 0.3
    max: 2.0

  dfl:
    distribution: uniform
    min: 1.0
    max: 2.5

  iou:
    distribution: uniform
    min: 0.5
    max: 0.8

  # ── Augmentation: ALL tunable (full mode) ──────────────────
  fliplr:
    distribution: uniform
    min: 0.0
    max: 0.7

  mosaic:
    distribution: uniform
    min: 0.0
    max: 1.0

  hsv_s:
    distribution: uniform
    min: 0.0
    max: 0.9

  hsv_v:
    distribution: uniform
    min: 0.0
    max: 0.9

  scale:
    distribution: uniform
    min: 0.0
    max: 0.9

  translate:
    distribution: uniform
    min: 0.0
    max: 0.2
