# ============================================================
# sweep_config_rtdetr_full.yaml
# WandB Sweep -- RT-DETR-L | Full Augmentation | F1 Objective
# Project: iToBoS Skin Lesion Detection
# Location: praveen/experiment-rtdetr/
#
# Adapted from Yamin's experiment-v26 sweep, but for RT-DETR:
#   - NO box/cls/dfl tuning (RT-DETR uses fixed internal loss gains)
#   - NO iou tuning (RT-DETR is NMS-free)
#   - Lower lr0 range (transformer detectors need smaller LR than YOLO)
#   - Augmentation params ARE tunable in full mode
# Runs from ~/code/iToBoS/ so program path starts with praveen/
# ============================================================

program: praveen/experiment-rtdetr/hparam_sweep.py
method: bayes

command:
  - ${env}
  - python
  - ${program}
  - --model
  - rtdetr-l.pt
  - --aug_mode
  - full
  - --device
  - "0"

metric:
  name: final/F1
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:

  # ── Learning Rate (lower than YOLO — transformer detector) ──
  lr0:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001

  lrf:
    distribution: uniform
    min: 0.01
    max: 0.2

  # ── Regularisation ─────────────────────────────────────────
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001

  dropout:
    distribution: uniform
    min: 0.0
    max: 0.3

  # ── Optimiser ──────────────────────────────────────────────
  momentum:
    distribution: uniform
    min: 0.85
    max: 0.98

  # ── Warmup ─────────────────────────────────────────────────
  warmup_epochs:
    values: [1, 2, 3]

  warmup_momentum:
    distribution: uniform
    min: 0.5
    max: 0.9

  # ── Augmentation: ALL tunable (full mode) ──────────────────
  fliplr:
    distribution: uniform
    min: 0.0
    max: 0.7

  mosaic:
    distribution: uniform
    min: 0.0
    max: 1.0

  hsv_s:
    distribution: uniform
    min: 0.0
    max: 0.9

  hsv_v:
    distribution: uniform
    min: 0.0
    max: 0.9

  scale:
    distribution: uniform
    min: 0.0
    max: 0.9

  translate:
    distribution: uniform
    min: 0.0
    max: 0.2
